<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>引換券｜奈良醸造</title>
<style>
  :root {
    --bg: #F5F3EE; --ink: #1E1E22; --accent: #B0463B; --muted: #6B6A66;
    --card: #FFFFFF; --line: #DDD9CF; --ok: #2F6B3F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }
  header { text-align: center; margin-bottom: 18px; }
  .brand { font-size: 12px; letter-spacing: .18em; color: var(--muted); }
  h1 { font-size: 21px; margin: 4px 0 0; line-height: 1.4; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input {
    width: 100%; font-size: 17px; padding: 12px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: #FBFAF7; color: var(--ink); margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    width: 100%; font-size: 17px; font-weight: 700; padding: 14px; border: 0; border-radius: 10px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; padding: 10px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: -8px 0 16px; }
  .err { color: var(--accent); font-size: 14px; margin-top: 12px; }
  .ticket { text-align: center; }
  .ticket .label { font-size: 12px; letter-spacing: .2em; color: var(--accent); font-weight: 700; }
  .ticket .event { font-size: 18px; font-weight: 700; margin: 2px 0 14px; }
  .qr { width: 72%; max-width: 260px; margin: 0 auto; background: #fff; }
  .qr svg { width: 100%; height: auto; display: block; }
  .bar { margin: 14px auto 0; width: 100%; background: #fff; }
  .bar svg { width: 100%; height: 84px; display: block; }
  .bar.solo { margin-top: 8px; }
  .bar.solo svg { height: 130px; }
  .bright { font-size: 13px; font-weight: 700; color: var(--accent); margin: 10px 0 0; }
  .digits { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 22px; letter-spacing: .08em; margin-top: 8px; font-weight: 700; }
  .meta { text-align: left; border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 14px; font-size: 14.5px; }
  .meta dt { font-size: 12px; color: var(--muted); }
  .meta dd { margin: 0 0 10px; }
  .meta ul { margin: 0; padding-left: 1.2em; }
  .notes { font-size: 12.5px; color: var(--muted); margin-top: 16px; text-align: left; }
  .notes li { margin-bottom: 4px; }
  .state { text-align: center; padding: 10px 0; }
  .state .big { font-size: 22px; font-weight: 800; }
  .state.used .big { color: var(--muted); }
  .state.wait .big { color: var(--accent); }
  .state.void .big { color: var(--accent); }
  .info { font-size: 13.5px; margin-top: 14px; padding: 10px 12px; background: var(--bg); border-radius: 10px; text-align: left; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  .hidden { display: none !important; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">NARA BREWING CO.</div>
    <h1 id="h-event">引換券</h1>
    <div class="sub" id="h-info"></div>
  </header>

  <!-- 入力フォーム -->
  <div class="card" id="form-card">
    <form id="f" novalidate>
      <label for="order">ご注文番号</label>
      <input id="order" inputmode="numeric" autocomplete="off" placeholder="例：123456789">
      <div class="hint">ご注文時のメールに記載の「受注番号」です</div>
      <label for="mail">ご注文時のメールアドレス</label>
      <input id="mail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com">
      <button id="submit" type="submit">引換券を表示する</button>
      <div class="err hidden" id="err"></div>
    </form>
  </div>

  <!-- 結果 -->
  <div class="card hidden" id="result-card">
    <div id="result"></div>
    <button class="ghost" id="back" type="button">別のご注文を表示する</button>
  </div>

  <footer id="foot"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
  // ===== 設定（ここだけ書き換える） =====
  var GAS_URL = 'ここにApps ScriptのURL（…/exec）を貼る';
  var BOOT = {
    eventName: 'イベント缶ビール引換券',
    eventInfo: '2026年11月8日（日）　会場内 奈良醸造ブース',
    contact: 'shop@narabrewing.com',
    barcode: 'CODE128'
  };
  // ===== 設定ここまで =====

  // Apps Script への問い合わせ（JSONP）。元の google.script.run と同じ形で呼べるようにする
  window.google = { script: { run: (function make(ok, ng) {
    return {
      withSuccessHandler: function (f) { return make(f, ng); },
      withFailureHandler: function (f) { return make(ok, f); },
      lookupTicket: function (o, m) {
        var cb = '__nb_cb' + Date.now() + Math.floor(Math.random() * 1000);
        var s = document.createElement('script');
        var timer = setTimeout(function () { finish(); ng && ng(new Error('TIMEOUT')); }, 20000);
        function finish() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
        window[cb] = function (r) { finish(); ok && ok(r); };
        s.onerror = function () { finish(); ng && ng(new Error('NETWORK')); };
        s.src = GAS_URL + '?p=ticket_lookup&o=' + encodeURIComponent(o) + '&m=' + encodeURIComponent(m) + '&cb=' + cb;
        document.head.appendChild(s);
      }
    };
  })() } };
  var STORE_KEY = 'nb_voucher_last';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toHalf(s) {
    return String(s || '').replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  }
  function save(o, m) { try { localStorage.setItem(STORE_KEY, JSON.stringify({ o: o, m: m })); } catch (e) {} }
  function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
  function forget() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  // 見出し
  if (BOOT.eventName) { $('h-event').textContent = BOOT.eventName; }
  $('h-info').textContent = BOOT.eventInfo || '';
  $('foot').innerHTML = '奈良醸造株式会社' + (BOOT.contact ? '<br>お問い合わせ：' + esc(BOOT.contact) : '');

  function setBusy(b) {
    $('submit').disabled = b;
    $('submit').innerHTML = b ? '<span class="spinner"></span>確認しています' : '引換券を表示する';
  }

  function showError(msg) { $('err').textContent = msg; $('err').classList.remove('hidden'); }

  function lookup(order, mail) {
    $('err').classList.add('hidden');
    setBusy(true);
    google.script.run
      .withSuccessHandler(function (r) {
        setBusy(false);
        if (!r || !r.ok) { showError((r && r.message) || '表示できませんでした。'); forget(); showForm(); return; }
        save(order, mail);
        render(r);
      })
      .withFailureHandler(function () {
        setBusy(false);
        showError('通信に失敗しました。電波の良い場所でもう一度お試しください。');
        showForm();
      })
      .lookupTicket(order, mail);
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var o = toHalf($('order').value).replace(/\D/g, '');
    var m = toHalf($('mail').value).trim();
    if (!o || m.indexOf('@') < 1) { showError('ご注文番号とメールアドレスを入力してください。'); return; }
    lookup(o, m);
  });

  $('back').addEventListener('click', function () {
    forget();
    $('order').value = ''; $('mail').value = '';
    showForm();
  });

  function showForm() { $('form-card').classList.remove('hidden'); $('result-card').classList.add('hidden'); }

  function qrSvg(text) {
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount(), q = 4, size = n + q * 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
      '<rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  function metaHtml(r) {
    var items = (r.items || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
    return '<dl class="meta">' +
      '<dt>お名前</dt><dd>' + esc(r.name) + ' 様</dd>' +
      '<dt>ご注文番号</dt><dd>' + esc(r.order) + '</dd>' +
      '<dt>引換内容（' + esc(r.qty) + '点）</dt><dd><ul>' + items + '</ul></dd></dl>';
  }

  function render(r) {
    var html = '';
    var mode = String(BOOT.barcode || 'CODE128');
    var hasQr = mode.indexOf('QR') >= 0, hasBar = mode.indexOf('128') >= 0;
    if (r.status === '未使用' && r.code) {
      var grouped = r.code.replace(/(\d{4})(?=\d)/g, '$1 ');
      html = '<div class="ticket"><div class="label">EXCHANGE TICKET</div>' +
        '<div class="event">' + esc(BOOT.eventName || '引換券') + '</div>' +
        (hasQr ? '<div class="qr" id="qr"></div>' : '') +
        (hasBar ? '<div class="bar' + (hasQr ? '' : ' solo') + '"><svg id="bar"></svg></div>' : '') +
        '<div class="digits">' + esc(grouped) + '</div>' +
        '<p class="bright">画面の明るさを最大にしてご提示ください</p>' +
        metaHtml(r) +
        (BOOT.eventInfo ? '<div class="info">' + esc(BOOT.eventInfo) + '</div>' : '') +
        '<ul class="notes">' +
        '<li>会場の引換所でこの画面をご提示ください。画面を明るくしていただくと読み取りが早くなります。</li>' +
        '<li>会場は電波がつながりにくいことがあります。<b>この画面のスクリーンショット</b>でも引換できます。</li>' +
        '<li>引換券は1回限り有効です。SNSへの投稿や他の方への共有はお控えください。</li>' +
        '</ul></div>';
      $('result').innerHTML = html;
      try { if (hasQr) $('qr').innerHTML = qrSvg(r.code); }
      catch (e) { $('qr').innerHTML = '<p class="err">QRコードを表示できませんでした。下の番号をスタッフにお伝えください。</p>'; }
      try {
        if (hasBar) {
          // 左右の余白（クワイエットゾーン）は 12モジュール分。CCDスキャナは余白が狭いと読めない
          JsBarcode('#bar', r.code, { format: 'CODE128', displayValue: false, width: 2, height: 100,
            marginTop: 4, marginBottom: 4, marginLeft: 24, marginRight: 24, background: '#ffffff', lineColor: '#000000' });
          // 枠の横幅いっぱいに伸ばす（縦横比を固定すると細く小さくなり、読み取りにくい）
          var svg = $('bar'), w = svg.getAttribute('width'), h = svg.getAttribute('height');
          if (!svg.getAttribute('viewBox') && w && h) svg.setAttribute('viewBox', '0 0 ' + parseFloat(w) + ' ' + parseFloat(h));
          svg.removeAttribute('width'); svg.removeAttribute('height');
          svg.setAttribute('preserveAspectRatio', 'none');
        }
      } catch (e) { var b = document.querySelector('.bar'); if (b) b.classList.add('hidden'); }
    } else {
      var cls = 'wait', big = '', msg = '';
      if (r.status === '引換済') { cls = 'used'; big = '引換済みです'; msg = (r.usedAt ? r.usedAt + ' に' : '') + 'お引き換えいただきました。ありがとうございました。'; }
      else if (r.status === '入金待ち') { big = 'ご入金の確認待ちです'; msg = 'ご入金を確認でき次第、ここに引換券が表示されます。お手数ですが、時間をおいて再度ご確認ください。'; }
      else { cls = 'void'; big = 'この引換券は無効です'; msg = 'ご注文がキャンセルされています。ご不明な点はお問い合わせください。'; }
      html = '<div class="state ' + cls + '"><div class="big">' + esc(big) + '</div><p>' + esc(msg) + '</p></div>' + metaHtml(r);
      $('result').innerHTML = html;
    }
    $('form-card').classList.add('hidden');
    $('result-card').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  // 前回の入力があれば自動で表示
  var last = load();
  if (last && last.o && last.m) {
    $('order').value = last.o; $('mail').value = last.m;
    lookup(last.o, last.m);
  }
</script>
</body>
</html>
